<!-- create task (buyer) page fragment -->
<div class="create-form">
  <div class="back-row"><a href="#/my-tasks">← আমার টাস্ক</a></div>
  <div class="card">
    <h3 class="card-title mb-2">নতুন টাস্ক তৈরি করুন</h3>
    <div class="alert alert-info">টাস্ক প্রকাশের সাথে সাথে মোট বাজেট (পুরস্কার × স্লট) আপনার ওয়ালেট থেকে <b>reserve</b> হবে — একই টাকায় দুটি টাস্ক দেওয়া সম্ভব হবে না।</div>
    <form id="form-create-task" novalidate>
      <div class="form-group">
        <label>টাস্কের শিরোনাম *</label>
        <input type="text" id="ct-title" class="form-control" placeholder="যেমন: আমার WhatsApp স্ট্যাটাসে এই ছবি পোস্ট করুন">
      </div>
      <div class="form-group">
        <label>বিস্তারিত বিবরণ ও Worker-এর করণীয় *</label>
        <textarea id="ct-desc" class="form-control" placeholder="ধাপে ধাপে লিখুন: কী করতে হবে, কোথায় যেতে হবে, কী প্রমাণ দিতে হবে..."></textarea>
      </div>
      <div class="form-group">
        <label>নিয়ম ও শর্ত (ঐচ্ছিক)</label>
        <textarea id="ct-rules" class="form-control" placeholder="যেমন: ভুয়া স্ক্রিনশট দিলে বাতিল হবে; সময়সীমার মধ্যে জমা দিতে হবে..."></textarea>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>প্রতি Worker পুরস্কার (৳) *</label>
          <input type="number" id="ct-reward" class="form-control" min="1" step="0.5" placeholder="যেমন: 10">
        </div>
        <div class="form-group">
          <label>মোট Worker স্লট *</label>
          <input type="number" id="ct-slots" class="form-control" min="1" step="1" placeholder="যেমন: 50">
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>সময়সীমা (ঘণ্টা)</label>
          <select id="ct-deadline" class="form-control">
            <option value="12">১২ ঘণ্টা</option>
            <option value="24" selected>২৪ ঘণ্টা</option>
            <option value="48">৪৮ ঘণ্টা</option>
            <option value="72">৭২ ঘণ্টা</option>
          </select>
        </div>
        <div class="form-group">
          <label>প্রমাণ জমার ধরন *</label>
          <select id="ct-proof" class="form-control">
            <option value="image">স্ক্রিনশট/ছবি</option>
            <option value="text">লিখিত বিবরণ</option>
            <option value="both" selected>উভয়ই</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>ক্যাটাগরি</label>
        <select id="ct-category" class="form-control"></select>
      </div>
      <div class="form-group">
        <label>টাস্কের ছবি (ঐচ্ছিক)</label>
        <div class="row">
          <input type="file" id="ct-image-file" accept="image/jpeg,image/png,image/webp,image/gif" class="form-control" style="padding:9px">
          <button type="button" class="btn btn-ghost btn-sm" id="ct-image-upload" style="flex-shrink:0">আপলোড</button>
        </div>
        <input type="url" id="ct-image" class="form-control mt-1" placeholder="অথবা ছবির URL">
      </div>

      <div class="cost-preview">
        <div class="cp-row"><span>প্রতি Worker পুরস্কার</span><b id="cp-reward">৳0.00</b></div>
        <div class="cp-row"><span>মোট স্লট</span><b id="cp-slots">0</b></div>
        <div class="cp-row cp-total"><span>মোট বাজেট (reserve হবে)</span><span id="cp-total">৳0.00</span></div>
        <div class="hint warn hidden" id="ct-balance-warn"></div>
        <div class="hint">💡 উত্তোলনযোগ্য ব্যালেন্স: <b id="cp-balance">৳0.00</b></div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" id="ct-submit">🚀 প্রকাশ করুন</button>
    </form>
  </div>
</div>
